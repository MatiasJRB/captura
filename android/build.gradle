plugins { id 'com.android.application' version '8.13.0' }
android {
    namespace 'org.example.captura'
    compileSdk 36
    defaultConfig {
        applicationId providers.gradleProperty('captureApplicationId').getOrElse('org.example.captura')
        minSdk 29; targetSdk 36; versionCode 2; versionName '0.2.0'
    }
    sourceSets { main { manifest.srcFile 'AndroidManifest.xml'; java.srcDirs = ['src']; res.srcDirs = ['res'] }; test.java.srcDirs = ['test'] }
    if (providers.gradleProperty('captureVoiceAssets').isPresent()) {
        sourceSets.main.assets.srcDir providers.gradleProperty('captureVoiceAssets').get()
    }
    // build.sh creates a NEW development key for this checkout, not the global phone key.
    // Never copy a phone's historical signing key into this repository.
    signingConfigs { debug { storeFile file('.local/debug.keystore') } }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'com.google.android.gms:play-services-auth:22.0.0'
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
