name: iOS TestFlight

# Archives the iPhone app on a GitHub macOS runner and uploads it to TestFlight,
# so a tester installs from the TestFlight app with no Mac, Xcode or cable.
#
# Nothing here is specific to one organization and nothing signing-related is stored
# in the repository: the Apple team, the App Store Connect API key and the Google
# client belong to whoever runs the fork, as repository secrets. A repository that
# has not set them stops at the first job and explains what is missing, so a fork of
# a public repository never fails red for a setup it was never meant to have.
#
# Setup and the list of secrets: docs/testflight.md.

on:
  workflow_dispatch:
  push:
    tags:
      - "ios-v*"

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          CAPTURA_BUNDLE_ID: ${{ secrets.CAPTURA_BUNDLE_ID }}
          CAPTURA_GOOGLE_IOS_CLIENT_ID: ${{ secrets.CAPTURA_GOOGLE_IOS_CLIENT_ID }}
        run: |
          missing=""
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 \
                      CAPTURA_BUNDLE_ID CAPTURA_GOOGLE_IOS_CLIENT_ID; do
            eval "value=\${$name}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## TestFlight is not configured in this repository"
              echo
              echo "No build was attempted. These repository secrets are empty or unset:"
              echo
              for name in $missing; do echo "- \`$name\`"; done
              echo
              echo "See [docs/testflight.md](../blob/HEAD/docs/testflight.md)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Not configured:$missing. Nothing to build."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  testflight:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 27
        run: |
          sudo xcode-select -s /Applications/Xcode_27.app
          xcodebuild -version
          {
            echo "ARCHIVE_PATH=$RUNNER_TEMP/Captura.xcarchive"
            echo "EXPORT_PATH=$RUNNER_TEMP/export"
            echo "EXPORT_OPTIONS=$RUNNER_TEMP/ExportOptions.plist"
            echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
          } >> "$GITHUB_ENV"

      - name: Write the build configuration
        env:
          BUNDLE_ID: ${{ secrets.CAPTURA_BUNDLE_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.CAPTURA_GOOGLE_IOS_CLIENT_ID }}
          HOSTED_DOMAIN: ${{ vars.CAPTURA_GOOGLE_HOSTED_DOMAIN }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 ios/scripts/configure.py \
            --bundle-id "$BUNDLE_ID" \
            --google-client-id "$GOOGLE_IOS_CLIENT_ID" \
            --team "$TEAM_ID" \
            ${HOSTED_DOMAIN:+--hosted-domain "$HOSTED_DOMAIN"} \
            --force

      - name: Install the App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          printf '%s\n' "$ASC_KEY_P8" > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project ios/Captura.xcodeproj \
            -scheme Captura \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Write the export options
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          INTERNAL_ONLY: ${{ vars.TESTFLIGHT_INTERNAL_ONLY || 'true' }}
        run: |
          cat > "$EXPORT_OPTIONS" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>testFlightInternalTestingOnly</key><${INTERNAL_ONLY}/>
          </dict>
          </plist>
          PLIST

      - name: Export and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -exportPath "$EXPORT_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the API key
        if: always()
        run: rm -f "$ASC_KEY_PATH"
