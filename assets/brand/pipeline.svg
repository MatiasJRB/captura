<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 790" role="img" aria-labelledby="title desc">
  <title id="title">Captura: from voice to reviewable evidence</title>
  <desc id="desc">User-started offline Android recording preserves the original M4A. Optional, opt-in Drive sync uploads closed files by Wi-Fi or manual sync. A local worker verifies hashes and transcribes with Whisper and voice activity detection into JSON, TXT and SRT. A human or external agent reviews the evidence; Captura does not execute spoken instructions.</desc>
  <rect width="600" height="790" rx="16" fill="#111815"/>
  <g font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <text x="36" y="61" fill="#e7ece8" font-size="34" font-weight="650" letter-spacing="-.7">Voice → evidence</text>
    <text x="36" y="97" fill="#a1d6be" font-size="22">Keep the original. Choose your agent.</text>
    <path d="M68 198v48m0 97v48m0 118v65" fill="none" stroke="#a1d6be" stroke-width="2"/>
    <path d="m61 237 7 9 7-9m-14 145 7 9 7-9m-14 174 7 9 7-9" fill="none" stroke="#a1d6be" stroke-width="2"/>
    <g fill="none" stroke="#a1d6be" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="49" y="137" width="38" height="60" rx="7"/>
      <path d="M60 148h16m-17 18v9m9-17v25m9-18v11"/>
      <path d="M48 304h40a13 13 0 0 0 1-26 21 21 0 0 0-40-3 15 15 0 0 0-1 29Z"/>
      <path d="m59 321 9 9 9-9m-9-12v21"/>
      <rect x="42" y="412" width="52" height="38" rx="4"/>
      <path d="M36 459h64m-44-32-6 5 6 5m24-10 6 5-6 5m-12-13-4 16"/>
    </g>
    <text x="118" y="160" fill="#e7ece8" font-size="30" font-weight="650">Capture on Android</text>
    <text x="118" y="195" fill="#bdccc2" font-size="22">You start it. Works offline.</text>
    <text x="118" y="226" fill="#a1d6be" font-size="22">Original M4A stays on your phone.</text>
    <text x="118" y="286" fill="#e7ece8" font-size="30" font-weight="650">Sync with Drive</text>
    <text x="118" y="321" fill="#bdccc2" font-size="22">Optional · opt-in · closed files only</text>
    <text x="118" y="352" fill="#bdccc2" font-size="22">Wi-Fi automatic, or manual sync</text>
    <text x="118" y="434" fill="#e7ece8" font-size="30" font-weight="650">Transcribe locally</text>
    <text x="118" y="469" fill="#bdccc2" font-size="22">Verify hashes → Whisper + VAD</text>
    <text x="118" y="500" fill="#a1d6be" font-size="22">Original + JSON / TXT / SRT</text>
    <path d="M36 546h528" stroke="#3b4b42" stroke-width="1" stroke-dasharray="5 6"/>
    <g fill="none" stroke="#f3b8a4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M51 594h28l9 9v42H51Z M79 594v10h9M59 615h21m-21 9h21m-21 9h14"/>
    </g>
    <text x="118" y="618" fill="#e7ece8" font-size="30" font-weight="650">Review with your agent</text>
    <text x="118" y="653" fill="#bdccc2" font-size="22">You or an external agent read it.</text>
    <text x="118" y="684" fill="#f3b8a4" font-size="22">Evidence, not automatic actions.</text>
    <text x="36" y="750" fill="#bdccc2" font-size="20">ASR can be wrong. Speakers are not verified.</text>
  </g>
</svg>
